name: Security regression tests
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install pinned test dependencies
        run: npm ci
      - name: Build LINE Flex preview from shared template
        run: npm run build:flex
      - name: Test reusable signup link history and cancellation
        run: node --check web/batch-registration.js && node tests/registration-links-ui.test.cjs
      - name: Test full-page bill payment experience
        run: node tests/payment-page.test.cjs && node --check web/payment-page.js && node --check web/payment-safety.js && node --check web/mobile-refinement.js
      - name: Test abnormal request detection and temporary blocking
        run: node tests/bot-protection.test.cjs
      - name: Test OTP recovery and LINE Flex notification preview
        run: node tests/account-access-api.test.cjs
      - name: Test LIFF Flex destinations and liff.state routing
        run: node tests/flex-designs.test.cjs && node tests/line-messages.test.cjs
      - name: Test mobile navigation reset after closing any dialog
        run: node tests/window-close-navigation-reset.test.cjs && node --check web/shop-notice-navigation.js
      - name: Check member bill title hierarchy
        run: |
          node --check web/material-layout.js
          node - <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const markup = fs.readFileSync('web/material-layout.js', 'utf8');
          const styles = fs.readFileSync('web/prototype-integration.css', 'utf8');
          assert.ok(markup.includes('<div class="mp-bill-description"><span class="mp-bill-description-label">รายละเอียด</span>'));
          assert.ok(markup.includes('<p class="mp-bill-due">'));
          assert.ok(styles.includes('.material-shell .mp-bill .mp-bill-description'));
          assert.ok(styles.includes('.material-shell .mp-bill .mp-bill-due'));
          console.log('Member bill title, description and due date hierarchy passed');
          NODE
      - name: Check updated login and profile scripts
        run: node --check web/app.js && node --check web/account-access.js
