<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>สมัครสมาชิก · finance MEDTECH</title><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./red-theme.css"><link rel="stylesheet" href="./communications.css"><link rel="stylesheet" href="./clay-theme.css?v=20261005clay"><script src="./config.js" defer></script><script src="./line-oauth.js?v=20261008line" defer></script><script src="./register.js?v=20261008line" defer></script><link rel="stylesheet" href="./account-access.css?v=20261008line"><link rel="icon" href="./medtech-tab-20261010.ico" sizes="16x16 32x32 48x48"><link rel="icon" type="image/png" sizes="32x32" href="./medtech-tab-20261010.png"><link rel="apple-touch-icon" href="./medtech-touch-20261010.png"><link rel="stylesheet" href="./material-expressive.css?v=20261011material"></head><body class="recovery-page"><main class="recovery-card"><img src="./medtech-logo.png" alt="MEDTECH" width="72" height="72"><span class="eyebrow">finance MEDTECH</span><h1>สมัครสมาชิก</h1><p id="invite-person"></p><p id="invite-expiry" class="help"></p><form id="student-lookup" class="registration-step" hidden><label for="signup-student">รหัสนักศึกษา</label><input id="signup-student" name="student_id" pattern="[0-9]{5,20}" maxlength="20" inputmode="numeric" autocomplete="username" required><button type="submit">ตรวจสอบรายชื่อและเชื่อม LINE</button></form><section id="registration-line" class="registration-step" hidden><h2>เชื่อม LINE ของคุณ</h2><p>คัดลอกข้อความนี้ แล้วส่งในแชต LINE OA</p><code id="registration-code"></code><button id="registration-copy" type="button">คัดลอกข้อความ</button><a id="registration-line-link" target="_blank" rel="noopener">เปิดแชต LINE OA ↗</a><p class="help">รหัสเชื่อม LINE ใช้ได้ 15 นาที กรุณากลับมาหน้านี้หลังส่งข้อความ</p><button id="registration-check" type="button">ส่งแล้ว · ตรวจสอบ LINE</button></section><form id="register-form" hidden><label for="register-password">รหัสผ่าน อย่างน้อย 6 ตัวอักษร</label><input id="register-password" name="password" type="password" minlength="6" maxlength="128" autocomplete="new-password" required><label for="register-confirm">ยืนยันรหัสผ่าน</label><input id="register-confirm" name="confirm" type="password" minlength="6" maxlength="128" autocomplete="new-password" required><button type="submit">สร้างบัญชี</button></form><div id="register-status" role="status" aria-live="polite">กำลังตรวจสอบลิงก์…</div><p><a href="./">กลับหน้าเข้าสู่ระบบ</a></p><a id="register-support" target="_blank" rel="noopener">ติดต่อผู้ดูแลระบบทาง LINE</a></main></body></html>
