name: Security regression tests
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install pinned test dependencies
        run: npm ci
      - name: Test full-page bill payment experience
        run: node tests/payment-page.test.cjs && node --check web/payment-page.js && node --check web/payment-safety.js && node --check web/mobile-refinement.js
      - name: Test abnormal request detection and temporary blocking
        run: node tests/bot-protection.test.cjs
      - name: Test OTP recovery and LINE Flex notification preview
        run: node tests/account-access-api.test.cjs
      - name: Test mobile navigation reset after closing any dialog
        run: node tests/window-close-navigation-reset.test.cjs && node --check web/shop-notice-navigation.js
      - name: Check updated login and profile scripts
        run: node --check web/app.js && node --check web/account-access.js
